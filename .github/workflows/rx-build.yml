name: RX build

on:
  push:
    branches: [main]
    paths:
      - 'RX/**'
      - '.github/workflows/rx-build.yml'
  pull_request:
    paths:
      - 'RX/**'
      - '.github/workflows/rx-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            RX/.pio
          key: pio-rx-${{ runner.os }}-${{ hashFiles('RX/platformio.ini') }}
          restore-keys: |
            pio-rx-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build RX firmware
        working-directory: RX
        shell: bash
        run: pio run 2>&1 | tee build.log

      - name: Firmware size report
        if: always()
        working-directory: RX
        shell: bash
        run: |
          {
            echo "### RX firmware size"
            echo '```'
            grep -E '^(RAM|Flash):' build.log || echo "no size info (build failed?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-check-rx-${{ runner.os }}-${{ hashFiles('RX/platformio.ini') }}
          restore-keys: |
            pio-check-rx-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run cppcheck
        working-directory: RX
        run: pio check --skip-packages --src-filters="+<src/> +<lib/>" --flags="--suppress=*:*.pio/*" --severity=medium --severity=high --fail-on-defect=high
