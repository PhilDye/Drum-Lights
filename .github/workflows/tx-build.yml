name: TX build

on:
  push:
    branches: [main]
    paths:
      - 'TX/**'
      - 'RX/src/main.cpp'
      - '.github/workflows/tx-build.yml'
  pull_request:
    paths:
      - 'TX/**'
      - 'RX/src/main.cpp'
      - '.github/workflows/tx-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            TX/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('TX/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Create dummy secrets.h
        run: |
          cat > TX/src/secrets.h <<'EOF'
          #define WIFI_SSID "ci-dummy"
          #define WIFI_PASS "ci-dummy"
          EOF

      - name: Build TX firmware
        working-directory: TX
        shell: bash # pipefail, so a failed build isn't hidden by tee
        run: pio run -e az-delivery-devkit-v4 -e spike-baseline -e spike-ble | tee build.log

      # the BLE spike (#19) needs the flash and RAM numbers side by side
      - name: Report firmware sizes
        working-directory: TX
        run: |
          {
            echo '### TX firmware size'
            echo '```'
            grep -E '^Processing |^(RAM|Flash):' build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    # also checks TX/app/src/modes.json against the TX and RX firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: TX/app/package-lock.json

      - name: Install dependencies
        working-directory: TX/app
        run: npm ci

      - name: Build web UI
        working-directory: TX/app
        run: npm run build
