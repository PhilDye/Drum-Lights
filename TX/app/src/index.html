<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drum LEDs Control</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#334691">
  <meta name="apple-mobile-web-app-title" content="Drum Control">
  <meta name="application-name" content="Drum Control">
  <meta name="msapplication-TileColor" content="#2d89ef">
  <meta name="theme-color" content="#ffffff">
  <script type="module" src="./js/main.js"></script>
</head>

<body>
  <div class="mx-auto text-center vh-100">
    <div class="container">
      <div class="row">
        <h1 class="my-2">Drum Control</h1>
        <div class="d-flex">
          <nav class="nav nav-pills flex-column me-3 gap-3" id="nav-tab" role="tablist" aria-orientation="vertical">
            <!-- effect tabs are generated from modes.json -->
            <button role="button" id="btnStrobe" class="btn btn-warning rounded-pill" type="button"
              data-action="strobe" aria-selected="false">Strobe</button>
          </nav>

          <div class="tab-content w-100" id="nav-tabContent">
            <!-- effect panes are generated from modes.json -->
          </div>
        </div>
      </div>
    </div>

    <div class="position-absolute bottom-0 start-50 translate-middle w-100">
      <button type="button" id="btnOff" class="btn btn-outline-primary btn-lg" data-action="off">Off</button>
      <button type="button" id="btnAuto" class="btn btn-outline-primary btn-lg" data-action="auto">Auto</button>
    </div>

    <div class="modal" id="networkModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
      aria-labelledby="networkModalTitle" aria-hidden="true" role="dialog">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="networkModalTitle">Disconnected</h5>
          </div>
          <div class="modal-body">
            <p>Trying to reconnect&hellip;</p>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="nineninenineModal" data-bs-keyboard="false" tabindex="-1" 
      aria-labelledby="nineninenineModalTitle" aria-hidden="true" role="dialog">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="nineninenineModalTitle">999 Mode</h5>
            <button type="button" class="btn-close" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p>Activate blue strobes?</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="btnNineNineNine">Activate</button>
          </div>
        </div>
      </div>
    </div>
</body>

</html>
