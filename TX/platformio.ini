; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3

[env]
framework = arduino
platform = espressif32@7.1.3 ; pinned to avoid ipv6 issues (#41)
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:version.py
lib_deps =
	nrf24/RF24@^1.4.2
	ottowinter/ESPAsyncWebServer-esphome@^3.2.2
	bblanchon/ArduinoJson@^6.19.4

; The TX: an ESP32-S3 with the WiFi web UI and the BLE service for the app.
; Moved from the classic ESP32 because its BLE controller connects unreliably
; and slowly (8/10 at 4.4 s against 20/20 at 1.0 s on an S3, see #19)
[env:esp32-s3]
board = esp32-s3-devkitc-1
; 3 MB app slots and a 1.5 MB filesystem; fits 8 MB and 16 MB boards
board_build.partitions = default_8MB.csv
lib_deps =
	${env.lib_deps}
	h2zero/NimBLE-Arduino@^2.1.0
build_flags =
	-DTX_BLE
	; the TX is only ever a peripheral
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
	; two phones and a watch, plus one spare
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
	; operator phones and watches; the oldest bond is dropped when full
	-DCONFIG_BT_NIMBLE_MAX_BONDS=8
	-DCONFIG_BT_NIMBLE_MAX_CCCDS=16
	; Serial on the native USB port. If your cable is in the UART (COM) port,
	; delete this line or the monitor will stay silent
	-DARDUINO_USB_CDC_ON_BOOT=1
; DTR drives GPIO0 through the UART port's auto-reset circuit, which straps the
; S3 into download mode and looks like a held BOOT button
monitor_dtr = 0
monitor_rts = 0

; The original TX on a classic ESP32 dev-kit: WiFi web UI only, no BLE.
; Kept so existing transmitters (and the current PCB) still get fixes
[env:az-delivery-devkit-v4]
board = az-delivery-devkit-v4
