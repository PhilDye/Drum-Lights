; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3

[env]
framework = arduino
platform = espressif32@8.0.0 ; Arduino-ESP32 3.x
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:version.py
; Arduino-ESP32 2.x passes -Os itself, so this changes nothing on 7.1.3, but
; espressif32 8.0.0 passes no optimisation level for project and library code
; and GCC then defaults to -O0: 250-400 KB bigger and slower (#41)
build_flags = -Os
lib_deps =
	nrf24/RF24@^1.4.2
	; the maintained forks; the esphome ones don't build on Arduino-ESP32 3.x (#41)
	esp32async/AsyncTCP@^3.5.0
	esp32async/ESPAsyncWebServer@^3.12.1
	bblanchon/ArduinoJson@^7.3.2

; The TX: an ESP32-S3 with the WiFi web UI and the BLE service for the app.
; Moved from the classic ESP32 because its BLE controller connects unreliably
; and slowly (8/10 at 4.4 s against 20/20 at 1.0 s on an S3, see #19)
[env:esp32-s3]
board = esp32-s3-devkitc-1
; 3 MB app slots and a 1.5 MB filesystem; fits 8 MB and 16 MB boards
board_build.partitions = default_8MB.csv
lib_deps =
	${env.lib_deps}
	h2zero/NimBLE-Arduino@^2.1.0
build_flags =
	${env.build_flags}
	-DTX_BLE
	; NimBLE roles, connections, bonds and logging are set in include/sdkconfig.h:
	; on Arduino-ESP32 3.x the core's sdkconfig overrides -D flags for them (#41)
	; on the include path for libraries too, ahead of the core's sdkconfig.h
	-I include
	; Serial on the native USB port. If your cable is in the UART (COM) port,
	; delete this line or the monitor will stay silent
	-DARDUINO_USB_CDC_ON_BOOT=1
; DTR drives GPIO0 through the UART port's auto-reset circuit, which straps the
; S3 into download mode and looks like a held BOOT button
monitor_dtr = 0
monitor_rts = 0

; The original TX on a classic ESP32 dev-kit: WiFi web UI only, no BLE.
; Kept so existing transmitters (and the current PCB) still get fixes
[env:az-delivery-devkit-v4]
board = az-delivery-devkit-v4
