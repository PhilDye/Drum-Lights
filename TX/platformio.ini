; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = az-delivery-devkit-v4

[env:az-delivery-devkit-v4]
framework = arduino
platform = espressif32@7.1.3
board = az-delivery-devkit-v4
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:version.py
lib_deps = 
	nrf24/RF24@^1.4.2
	ottowinter/ESPAsyncWebServer-esphome@^3.2.2
	bblanchon/ArduinoJson@^6.19.4

; Phase 1 BLE coexistence spike (#19). Throwaway: both envs carry the same
; heap telemetry and RF test, so the only difference between them is BLE
; (see tools/spike/README.md). Flash one with e.g. pio run -e spike-ble -t upload
[env:spike-baseline]
extends = env:az-delivery-devkit-v4
build_flags = -DSPIKE

[env:spike-ble]
extends = env:az-delivery-devkit-v4
; the TX is only ever a peripheral, so leave the central and observer roles out
build_flags =
	-DSPIKE -DBLE_SPIKE
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
lib_deps =
	${env:az-delivery-devkit-v4.lib_deps}
	h2zero/NimBLE-Arduino@^2.1.0

; BLE-only isolation test: no WiFi AP / DNS / webserver at all, to tell BLE
; radio instability apart from WiFi+BT coexistence (ad hoc, see chat history
; in #19 — delete once the coexistence question is settled)
[env:spike-ble-only]
extends = env:spike-ble
build_flags =
	${env:spike-ble.build_flags}
	-DSPIKE_NO_WIFI

; spike-ble-only plus verbose NimBLE + ESP32 core logging, to see what the BLE
; controller actually does during a connection attempt that the central aborts
; (#19 — the advertising-stops bug; see tools/spike/README.md)
[env:spike-ble-debug]
extends = env:spike-ble-only
build_flags =
	${env:spike-ble-only.build_flags}
	-DCONFIG_NIMBLE_CPP_LOG_LEVEL=4
	-DCORE_DEBUG_LEVEL=5

; Platform bump test for the advertising/connect problem (#19). The BLE
; controller blob ships with the platform package, which is the layer the
; stale-isAdvertising() bug lives in, so a newer platform is the most likely
; source of a real fix. Isolated env on purpose: the production pin stays at
; 7.1.3, pinned deliberately to avoid ipv6 issues. Note 8.0.0 brings
; Arduino-ESP32 3.x (vs 2.x on 7.1.3), which is a breaking API change.
[env:spike-ble-next]
extends = env:spike-ble-only
platform = espressif32@8.0.0
