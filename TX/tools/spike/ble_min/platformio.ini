; Minimal standalone NimBLE peripheral, for testing the #19 advertising bug
; against different espressif32 platform versions.
;
; The main TX firmware can't be built on espressif32 8.0.0 at all: that brings
; Arduino-ESP32 3.x, which drops IPv6Address.h, and ESPAsyncWebServer-esphome /
; AsyncTCP-esphome still need it. (That is the "ipv6 issues" the production pin
; in ../../../platformio.ini exists to avoid.) That failure is in the web stack,
; nothing to do with BLE — so this project reproduces the advertising bug with
; NimBLE only, to tell whether a platform bump fixes the BLE controller.
;
; pio run -e p713 -t upload   # baseline, same platform as production
; pio run -e p800 -t upload   # the bump under test
[env]
framework = arduino
board = az-delivery-devkit-v4
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.1.0

[env:p713]
platform = espressif32@7.1.3

[env:p800]
platform = espressif32@8.0.0
