; BLE + WiFi coexistence test harness (#19): the TX's WiFi AP, DNS, web server,
; WebSocket, LittleFS and BLE GATT service on a bare ESP32-S3, with the RF24
; simulated, so the spike can run without the TX hardware.
;
;   pio run -e s3-ble -t upload && pio device monitor
;
; s3-noble is the same firmware without BLE, for the heap comparison.

[platformio]
default_envs = s3-ble

[env]
framework = arduino
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
	ottowinter/ESPAsyncWebServer-esphome@^3.2.2
	bblanchon/ArduinoJson@^6.19.4
; Serial on the native USB port. If your cable is in the UART (COM) port,
; delete -DARDUINO_USB_CDC_ON_BOOT=1 or the monitor will stay silent
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:s3-ble]
lib_deps =
	${env.lib_deps}
	h2zero/NimBLE-Arduino@^2.1.0
build_flags =
	${env.build_flags}
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

[env:s3-noble]
build_flags =
	${env.build_flags}
	-DNO_BLE
