<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple Watch controller</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#0A84FF}a:hover{color:#64D2FF}
button{font-family:inherit;color:inherit;margin:0}
</style>
</helmet>
<div style="width: 300px; height: 366px; position: relative; overflow: hidden; background: #000; color: #F2F2F7; font-family: -apple-system, system-ui, 'Helvetica Neue', sans-serif; padding: 22px 16px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 15px; font-weight: 700; color: #0A84FF">Drum Lights</span>
    <span style="font-size: 13px; color: #AEAEB2">Fireworks night</span>
  </div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 8px">
    <button style="border-radius: 16px; border: 2px solid transparent; background: #1C1C1E; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left"><span style="height: 8px; width: 100%; border-radius: 4px; background: #0A84FF"></span><span style="font-size: 15px; font-weight: 700">Blue Chase</span></button>
    <button style="border-radius: 16px; border: 2px solid #F2F2F7; background: #2C2C2E; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left"><span style="height: 8px; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #0A84FF 0% 33%, #30D158 33% 66%, #FFD60A 66% 100%)"></span><span style="font-size: 15px; font-weight: 700">Rio Spin</span></button>
    <button style="border-radius: 16px; border: 2px solid transparent; background: #1C1C1E; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left"><span style="height: 8px; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #FFD60A 0% 50%, #0A84FF 50% 100%)"></span><span style="font-size: 15px; font-weight: 700">Yel/Blu Tw.</span></button>
    <button style="border-radius: 16px; border: 2px solid transparent; background: #1C1C1E; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left"><span style="height: 8px; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #FF453A 0% 20%, #FF9F0A 20% 40%, #FFD60A 40% 60%, #30D158 60% 80%, #0A84FF 80% 100%)"></span><span style="font-size: 15px; font-weight: 700">Rainbow</span></button>
  </div>
  <button style="height: 48px; border-radius: 22px; border: none; background: #FF9F0A; color: #000; font-size: 18px; font-weight: 800; letter-spacing: 1.5px">STROBE</button>
  <div style="font-size: 12px; color: #AEAEB2; text-align: center">Crown: scroll palette · Double tap: Strobe</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":300,"height":366}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}

</html>
